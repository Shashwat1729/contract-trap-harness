services:
  baseline:
    build: ./baseline
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PORT: 8000
      EVAL_MOCK: ${EVAL_MOCK:-0}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      RETRY_MAX_WAIT: ${RETRY_MAX_WAIT:-4}
    volumes:
      - ./evidence:/app/evidence
    healthcheck:
      # python:3.11-slim ships no curl -- probe with the interpreter that is guaranteed present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  advanced:
    build: ./advanced
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      PORT: 8001
      EVAL_MOCK: ${EVAL_MOCK:-0}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      RETRY_MAX_WAIT: ${RETRY_MAX_WAIT:-4}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash}
    volumes:
      - ./evidence:/app/evidence
    healthcheck:
      # python:3.11-slim ships no curl -- probe with the interpreter that is guaranteed present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

